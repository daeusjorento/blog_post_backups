name: Sync blog backups

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Refresh backups from daeus.blog
        run: python scripts/sync_blog.py
      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Blog backups are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Sync blog backups from daeus.blog"
          git push
